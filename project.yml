name: bycreep
options:
  bundleIdPrefix: com.bycreep
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_COMPILATION_MODE: wholemodule
targets:
  bycreep:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: bycreepWidget
    entitlements:
      path: App/bycreep.entitlements
      properties:
        com.apple.security.application-groups: [group.com.bycreep.app]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: bycreep
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Камера нужна для фото прогресса
        NSPhotoLibraryUsageDescription: Галерея нужна для фото прогресса
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bycreep.app
        CODE_SIGN_STYLE: Automatic
  bycreepWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/bycreepWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.bycreep.app]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: bycreep
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bycreep.app.widget
        SKIP_INSTALL: YES
