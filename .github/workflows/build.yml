name: Build IPA
on:
push:
branches: [main, master]
workflow_dispatch:
jobs:
build:
runs-on: macos-14
steps:
- uses: actions/checkout@v4
- name: Install XcodeGen
run: brew install xcodegen
- name: Generate Xcode project
run: xcodegen generate
- name: Build (unsigned)
run: |
xcodebuild \
-project bycreep.xcodeproj \
-scheme bycreep \
-configuration Release \
-sdk iphoneos \
-destination 'generic/platform=iOS' \
-derivedDataPath build \
CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
build
- name: Package IPA
run: |
mkdir -p Payload
cp -R build/Build/Products/Release-iphoneos/bycreep.app Payload/
zip -qry bycreep.ipa Payload
- uses: actions/upload-artifact@v4
with:
name: bycreep-ipa
path: bycreep.ipa
